[project]
name = "csaf-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "apiflask>=2.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-migrate>=4.0.7",
    "flask-jwt-extended>=4.6.0",
    "flask-cors>=4.0.0",
    "psycopg2-binary>=2.9.9",
    "bcrypt>=4.1.2",
    "marshmallow>=3.21.1",
    "python-dotenv>=1.0.1",
    "feedgen>=1.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
